[package]
name = "riven-os"
version = "0.1.0"
authors = ["Rico Viviers <ricoleonardv@gmail.com>"]
edition = "2024"

[dependencies]
bootloader = "0.9.0"
volatile = "0.2.6"
spin = "0.5.2"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "riven-os"
test = false
bench = false
